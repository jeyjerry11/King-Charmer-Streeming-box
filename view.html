<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>KC Streaming - Viewer</title>
  <style>
    body {
      margin: 0;
      font-family: sans-serif;
      background-color: #111;
      color: #fff;
      display: flex;
      flex-direction: column;
      height: 100vh;
    }
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background-color: #222;
      padding: 10px 20px;
    }
    .controls button {
      margin: 0 5px;
      padding: 6px 12px;
      background: #444;
      color: white;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      transition: 0.2s;
    }
    .controls button:hover {
      background: #666;
    }
    .info-bar {
      background-color: #333;
      padding: 8px 20px;
      display: flex;
      justify-content: space-between;
      font-size: 0.9rem;
    }
    #videoWrapper {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 10px;
    }
    video {
      max-width: 100%;
      max-height: 100%;
      border: 4px solid #666;
      border-radius: 12px;
    }
  </style>
</head>
<body id="viewerBody">

  <div class="header">
    <span>🎬 Now Playing</span>
    <div class="controls">
      <button onclick="toggleView()">🔁 Rotate</button>
      <button onclick="setMobileFit()">📱 Fit Android</button>
      <button onclick="setPCFit()">🖥️ Fit PC</button>
      <button onclick="downloadVideo()">⬇ Download</button>
      <button onclick="goBack()">🔙 Back</button>
    </div>
  </div>

  <div class="info-bar">
    <span id="streamCost">Streaming cost: 0 MB / ₦0</span>
    <span id="downloadCost">Download cost: 0 MB / ₦0</span>
  </div>

  <div id="videoWrapper">
    <video id="mainVideo" controls autoplay playsinline>
      Sorry, your browser doesn’t support video playback.
    </video>
  </div>

  <script>
    const videoEl = document.getElementById("mainVideo");
    const streamCostEl = document.getElementById("streamCost");
    const downloadCostEl = document.getElementById("downloadCost");
    const params = new URLSearchParams(window.location.search);
    const videoUrl = decodeURIComponent(params.get("vid"));
    const videoId = params.get("id") || Date.now().toString();

    // Backends
    const BACKEND_URL = "https://king-charmer-streeming-box.onrender.com";
    const ANALYTICS_URL = "https://kingcharmer-analytics-co-ng.onrender.com";

    const RATE_MB = 1.8; // per second
    const RATE_NGN = 1.8; // per second

    if (videoUrl) videoEl.src = videoUrl;
    else alert("No video URL provided.");

    // --- Video view controls ---
    function toggleView() {
      document.body.classList.toggle("fullscreen");
      if (videoEl.requestFullscreen) videoEl.requestFullscreen();
      else document.exitFullscreen();
    }
    function setMobileFit() { videoEl.style.width="100%"; videoEl.style.height="auto"; }
    function setPCFit() { videoEl.style.width="80%"; videoEl.style.height="auto"; }
    function goBack() { window.location.href="watch.html"; }

    // Format numbers smartly (convert MB → GB when large)
    function formatDataSize(mb) {
      if (mb >= 1024) return (mb / 1024).toFixed(2) + " GB";
      return mb.toFixed(2) + " MB";
    }

    // --- Download video ---
    async function downloadVideo() {
      const link = document.createElement('a');
      link.href = videoEl.src;
      link.download = 'video.mp4';
      document.body.appendChild(link);
      link.click();
      document.body.removeChild(link);

      const durationSec = Math.ceil(videoEl.duration || 1);
      const downloadMB = durationSec * RATE_MB;
      const chargeNGN = durationSec * RATE_NGN;
      downloadCostEl.textContent = `Download cost: ${formatDataSize(downloadMB)} / ₦${chargeNGN.toFixed(2)}`;

      // Backend tracking
      try {
        await fetch(`${BACKEND_URL}/api/track-download`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            videoId,
            size: downloadMB,
            ngn: chargeNGN,
            provider: getNetworkProvider(),
            timestamp: new Date().toISOString()
          })
        });
        console.log("⬇️ Download logged:", videoId, downloadMB + "MB");
      } catch (err) {
        console.error("Download tracking failed:", err);
      }

      sendAnalytics("download", downloadMB, chargeNGN);
    }

    // --- Stream tracking ---
    let secondsViewed = 0;
    setInterval(async () => {
      if (!videoEl.paused && !videoEl.ended) {
        secondsViewed++;
        const usedMB = RATE_MB * secondsViewed;
        const earnedNGN = RATE_NGN * secondsViewed;
        streamCostEl.textContent = `Streaming cost: ${formatDataSize(usedMB)} / ₦${earnedNGN.toFixed(2)}`;

        // Backend tracking
        try {
          await fetch(`${BACKEND_URL}/api/track-stream`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              videoId,
              seconds: 1,
              provider: getNetworkProvider(),
              timestamp: new Date().toISOString()
            })
          });
        } catch (err) {
          console.error("Stream tracking failed:", err);
        }

        sendAnalytics("view", RATE_MB, RATE_NGN);
      }
    }, 1000);

    // --- Unified analytics ---
    async function sendAnalytics(event, dataUsedMB, earnedNGN) {
      try {
        await fetch(`${ANALYTICS_URL}/api/event`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            event,
            provider: getNetworkProvider(),
            dataUsedMB,
            earnedNGN,
            timestamp: new Date().toISOString()
          })
        });
        console.log(`✅ Logged ${event}: ${dataUsedMB}MB / ₦${earnedNGN}`);
      } catch (err) {
        console.error(`❌ Failed to log ${event}:`, err);
      }
    }

    // --- Detect network provider dynamically ---
    function getNetworkProvider() {
      const ua = navigator.userAgent.toLowerCase();
      if (ua.includes("mtn")) return "MTN";
      if (ua.includes("airtel")) return "Airtel";
      if (ua.includes("glo")) return "Glo";
      if (ua.includes("9mobile")) return "9mobile";
      if (ua.includes("spectranet")) return "Spectranet";
      return "Unknown";
    }

    // --- Initial view log ---
    videoEl.addEventListener("play", () => {
      sendAnalytics("view-start", 0, 0);
      console.log("▶️ Video started");
    });

    // --- Detect provider change mid-stream ---
    let lastProvider = getNetworkProvider();
    setInterval(() => {
      const currentProvider = getNetworkProvider();
      if (currentProvider !== lastProvider) {
        console.log(`📡 Provider changed from ${lastProvider} ➜ ${currentProvider}`);
        lastProvider = currentProvider;
        sendAnalytics("provider-change", 0, 0);
      }
    }, 5000);
  </script>
</body>
</html>
