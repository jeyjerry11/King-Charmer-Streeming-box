<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>KC Streaming - Viewer</title>
  <style>
    body {
      margin: 0;
      font-family: sans-serif;
      background-color: #111;
      color: #fff;
      display: flex;
      flex-direction: column;
      height: 100vh;
    }
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background-color: #222;
      padding: 10px 20px;
    }
    .controls button {
      margin: 0 5px;
      padding: 6px 12px;
      background: #444;
      color: white;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      transition: 0.2s;
    }
    .controls button:hover {
      background: #666;
    }
    .info-bar {
      background-color: #333;
      padding: 8px 20px;
      display: flex;
      justify-content: space-between;
      font-size: 0.9rem;
    }
    #videoWrapper {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 10px;
    }
    video {
      max-width: 100%;
      max-height: 100%;
      border: 4px solid #666;
      border-radius: 12px;
    }
  </style>
</head>
<body id="viewerBody">

  <div class="header">
    <span>🎬 Now Playing</span>
    <div class="controls">
      <button onclick="toggleView()">🔁 Rotate</button>
      <button onclick="setMobileFit()">📱 Fit Android</button>
      <button onclick="setPCFit()">🖥️ Fit PC</button>
      <button onclick="downloadVideo()">⬇ Download</button>
      <button onclick="goBack()">🔙 Back</button>
    </div>
  </div>

  <div class="info-bar">
    <span id="streamCost">Streaming cost: 0 MB / ₦0</span>
    <span id="downloadCost">Download cost: 0 MB / ₦0</span>
  </div>

  <div id="videoWrapper">
    <video id="mainVideo" controls autoplay playsinline>
      Sorry, your browser doesn’t support video playback.
    </video>
  </div>

  <script>
    const videoEl = document.getElementById("mainVideo");
    const streamCostEl = document.getElementById("streamCost");
    const downloadCostEl = document.getElementById("downloadCost");
    const params = new URLSearchParams(window.location.search);
    const videoUrl = decodeURIComponent(params.get("vid"));
    const videoId = params.get("id") || Date.now().toString();
    const sessionId = localStorage.getItem("sessionId") || (()=>{
      const id = Date.now().toString() + Math.random().toString(36).slice(2);
      localStorage.setItem("sessionId", id);
      return id;
    })();

    // Use provider from localStorage (user selection), fallback to detection
    function getNetworkProvider() {
      return localStorage.getItem("provider") || detectProvider();
    }
    function detectProvider() {
      const ua = navigator.userAgent.toLowerCase();
      if (ua.includes("mtn")) return "MTN";
      if (ua.includes("airtel")) return "Airtel";
      if (ua.includes("glo")) return "Glo";
      if (ua.includes("9mobile")) return "9mobile";
      if (ua.includes("spectranet")) return "Spectranet";
      return "Unknown";
    }

    // Backends
    const ANALYTICS_URL = "https://kingcharmer-analytics-co-ng.onrender.com";

    const RATE_MB = 1.8; // per second
    const RATE_NGN = 1.8; // per second

    if (videoUrl) videoEl.src = videoUrl;
    else alert("No video URL provided.");

    // --- Video view controls ---
    function toggleView() {
      document.body.classList.toggle("fullscreen");
      if (videoEl.requestFullscreen) videoEl.requestFullscreen();
      else document.exitFullscreen();
    }
    function setMobileFit() { videoEl.style.width="100%"; videoEl.style.height="auto"; }
    function setPCFit() { videoEl.style.width="80%"; videoEl.style.height="auto"; }
    function goBack() { window.location.href="watch.html"; }

    // Format numbers smartly (convert MB → GB when large)
    function formatDataSize(mb) {
      if (mb >= 1024) return (mb / 1024).toFixed(2) + " GB";
      return mb.toFixed(2) + " MB";
    }

    // --- Download video ---
    async function downloadVideo() {
      const link = document.createElement('a');
      link.href = videoEl.src;
      link.download = 'video.mp4';
      document.body.appendChild(link);
      link.click();
      document.body.removeChild(link);

      const durationSec = Math.ceil(videoEl.duration || 1);
      const downloadMB = durationSec * RATE_MB;
      const chargeNGN = durationSec * RATE_NGN;
      downloadCostEl.textContent = `Download cost: ${formatDataSize(downloadMB)} / ₦${chargeNGN.toFixed(2)}`;

      // Analytics backend tracking
      try {
        await fetch(`${ANALYTICS_URL}/api/log-download`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            videoId,
            sessionId,
            size: downloadMB,
            ngn: chargeNGN,
            provider: getNetworkProvider(),
            timestamp: new Date().toISOString()
          })
        });
        console.log("⬇️ Download logged:", videoId, downloadMB + "MB");
      } catch (err) {
        console.error("Download tracking failed:", err);
      }
    }

    // --- Stream tracking ---
    let secondsViewed = 0;
    let totalMB = 0;
    let totalNGN = 0;

    setInterval(async () => {
      if (!videoEl.paused && !videoEl.ended) {
        secondsViewed++;
        totalMB += RATE_MB;
        totalNGN += RATE_NGN;
        streamCostEl.textContent = `Streaming cost: ${formatDataSize(totalMB)} / ₦${totalNGN.toFixed(2)}`;

        // Send cumulative session stats every 10 seconds (reduces writes and aggregates data)
        if (secondsViewed % 10 === 0) {
          try {
            await fetch(`${ANALYTICS_URL}/api/log-stream`, {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({
                videoId,
                sessionId,
                seconds: secondsViewed,
                dataUsedMB: totalMB,
                earnedNGN: totalNGN,
                provider: getNetworkProvider(),
                timestamp: new Date().toISOString()
              })
            });
            console.log(`📊 Stream logged: ${secondsViewed}s, ${totalMB}MB, ₦${totalNGN}`);
          } catch (err) {
            console.error("Stream tracking failed:", err);
          }
        }
      }
    }, 1000);

    // --- Initial view log ---
    videoEl.addEventListener("play", () => {
      // Log start event
      fetch(`${ANALYTICS_URL}/api/log-view`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          videoId,
          event: "view-start",
          provider: getNetworkProvider(),
          dataUsedMB: 0,
          earnedNGN: 0,
          timestamp: new Date().toISOString()
        })
      });
      console.log("▶️ Video started");
    });

    // --- Detect provider change mid-stream ---
    let lastProvider = getNetworkProvider();
    setInterval(() => {
      const currentProvider = getNetworkProvider();
      if (currentProvider !== lastProvider) {
        console.log(`📡 Provider changed from ${lastProvider} ➜ ${currentProvider}`);
        lastProvider = currentProvider;
        fetch(`${ANALYTICS_URL}/api/log-view`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            videoId,
            event: "provider-change",
            provider: currentProvider,
            dataUsedMB: 0,
            earnedNGN: 0,
            timestamp: new Date().toISOString()
          })
        });
      }
    }, 5000);
  </script>
</body>
</html>
