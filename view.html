<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>KC Streaming - Viewer</title>
  <style>
    body {
      margin: 0;
      font-family: sans-serif;
      background-color: #111;
      color: #fff;
      display: flex;
      flex-direction: column;
      height: 100vh;
    }
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background-color: #222;
      padding: 10px 20px;
    }
    .controls button {
      margin: 0 5px;
      padding: 5px 10px;
      background: #444;
      color: white;
      border: none;
      border-radius: 4px;
      cursor: pointer;
    }
    .info-bar {
      background-color: #333;
      padding: 8px 20px;
      display: flex;
      justify-content: space-between;
      font-size: 0.9rem;
    }
    #videoWrapper {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 10px;
    }
    video {
      max-width: 100%;
      max-height: 100%;
      border: 4px solid #666;
      border-radius: 12px;
    }
  </style>
</head>
<body id="viewerBody">

  <div class="header">
    <span>🎬 Now Playing</span>
    <div class="controls">
      <button onclick="toggleView()">🔁 Rotate</button>
      <button onclick="setMobileFit()">📱 Fit Android</button>
      <button onclick="setPCFit()">🖥️ Fit PC</button>
      <button onclick="downloadVideo()" class="download-btn">⬇ Download</button>
      <button onclick="goBack()">🔙 Back</button>
    </div>
  </div>

  <div class="info-bar">
    <span id="streamCost">Streaming cost: 0 MB</span>
    <span id="downloadCost">Download cost: 0 MB</span>
  </div>

  <div id="videoWrapper">
    <video id="mainVideo" controls autoplay playsinline>
      Sorry, your browser doesn’t support video playback.
    </video>
  </div>

  <script>
    const videoEl = document.getElementById("mainVideo");
    const streamCostEl = document.getElementById("streamCost");
    const downloadCostEl = document.getElementById("downloadCost");
    const params = new URLSearchParams(window.location.search);
    const videoUrl = decodeURIComponent(params.get("vid"));
    const videoId = params.get("id");
    const BACKEND_URL = "https://king-charmer-streeming-box.onrender.com";
    const ANALYTICS_URL = "https://kingcharmer-analytics-co-ng.onrender.com";

    if (videoUrl) videoEl.src = videoUrl;
    else alert("No video URL provided.");

    // --- Video view controls ---
    function toggleView() {
      document.body.classList.toggle("fullscreen");
      if (videoEl.requestFullscreen) videoEl.requestFullscreen();
      else document.exitFullscreen();
    }
    function setMobileFit() { videoEl.style.width="100%"; videoEl.style.height="auto"; }
    function setPCFit() { videoEl.style.width="80%"; videoEl.style.height="auto"; }
    function goBack() { window.location.href="watch.html"; }

    // --- Download video ---
    function downloadVideo() {
      const link = document.createElement('a');
      link.href = videoEl.src;
      link.download = 'video.mp4';
      document.body.appendChild(link);
      link.click();
      document.body.removeChild(link);

      // Calculate MB based on video duration (1MB per second)
      const durationSec = videoEl.duration || 1; // fallback to 1s
      const downloadMB = Math.ceil(durationSec); // 1MB per second
      const chargeNGN = downloadMB; // 1MB = 1₦
      downloadCostEl.textContent = `Download cost: ${chargeNGN} MB / ₦${chargeNGN}`;

      // Backend tracking for download
      fetch(`${BACKEND_URL}/api/track-download`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          videoId,
          sizeMB: downloadMB,
          ngn: chargeNGN,
          provider: getNetworkProvider(),
          timestamp: new Date().toISOString()
        })
      }).catch(err => console.error("Download tracking failed:", err));

      sendAnalytics("download", downloadMB);
    }

    // --- Stream tracking ---
    let secondsViewed = 0;
    setInterval(() => {
      if (!videoEl.paused && !videoEl.ended) {
        secondsViewed++;
        const chargeMB = secondsViewed; // 1MB per second
        const chargeNGN = secondsViewed; // 1₦ per second
        streamCostEl.textContent = `Streaming cost: ${chargeMB} MB / ₦${chargeNGN}`;

        // Backend tracking for stream
        fetch(`${BACKEND_URL}/api/track-stream`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            videoId,
            seconds: 1,
            provider: getNetworkProvider(),
            timestamp: new Date().toISOString()
          })
        }).catch(err => console.error("Stream tracking failed:", err));

        sendAnalytics("view", 1); // 1MB per second
      }
    }, 1000);

    // --- Unified analytics ---
    async function sendAnalytics(event, dataUsedMB) {
      try {
        await fetch(`${ANALYTICS_URL}/api/event`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            event,
            provider: getNetworkProvider(),
            dataUsedMB
          })
        });
        console.log(`✅ Logged ${event} (${dataUsedMB}MB)`);
      } catch (err) {
        console.error(`❌ Failed to log ${event}:`, err);
      }
    }

    // --- Detect network provider dynamically ---
    function getNetworkProvider() {
      const ua = navigator.userAgent.toLowerCase();
      if (ua.includes("mtn")) return "MTN";
      if (ua.includes("airtel")) return "Airtel";
      if (ua.includes("glo")) return "Glo";
      if (ua.includes("9mobile")) return "9mobile";
      if (ua.includes("spectranet")) return "Spectranet";
      return "Unknown";
    }

    // Optional: log initial video play
    videoEl.addEventListener("play", () => sendAnalytics("view", 1));

    // Detect if network provider changes mid-stream
    let lastProvider = getNetworkProvider();
    setInterval(() => {
      const currentProvider = getNetworkProvider();
      if (currentProvider !== lastProvider) {
        console.log(`📡 Provider changed from ${lastProvider} to ${currentProvider}`);
        lastProvider = currentProvider;
        sendAnalytics("provider-change", 0);
      }
    }, 5000);

  </script>
</body>
</html>
